<!DOCTYPE html>
<html>

<head>
    <title>Log In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        body {
            background: #f2f2f2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 16px;
        }

        .box {
            max-width: 420px;
            margin: auto;
            padding: 40px;
            background: white;
            border: 5px solid #222;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 26px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 15px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #999;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            font-weight: bold;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .error {
            background: #fdeaea;
            border: 2px solid #a11414;
            color: #a11414;
            padding: 10px 12px;
            margin-bottom: 20px;
            font-size: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Log In</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log In</button>
        </form>

    </div>

</body>

</html>
